version: '3.9'
services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_DEBUG=false
      - SECRET_KEY=change-this-to-a-random-secret
      - PORT=5000
    volumes:
      - ./uploads:/app/uploads
      - ./users.json:/app/users.json
      - ./history.json:/app/history.json
    restart: unless-stopped
